# Supabase (Postgres) - all values come from environment variables so
# nothing sensitive is committed. See README for where to find these.
spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres?user=postgres.mdhywjqyevfyqnaycvoc&password=joshuadavegwapo1
spring.datasource.username="postgres.mdhywjqyevfyqnaycvoc"
spring.datasource.password="joshuadavegwapo1"
spring.datasource.driver-class-name=org.postgresql.Driver

# Tables come from sql/schema.sql, not from Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Low-stock business rule (Lab 2) and reorder policy (Lab 3).
inventory.low-stock-threshold=5
inventory.reorder-target-multiplier=3

# LegacySupply (Lab 3). LS_API_KEY and LS_CLIENT_ID come from environment
# variables - never commit real values here. See README and INTEGRATION.md.
legacysupply.base-url=https://legacysupply.onrender.com/api/v1
legacysupply.client-id=${LS_CLIENT_ID}
legacysupply.api-key=${LS_API_KEY}
legacysupply.timeout-ms=3000
legacysupply.max-attempts=3
# How often the PENDING-reorder queue is retried and open orders are
# polled for status. Widen these if you're hitting E-RATE-03.
legacysupply.reorder-queue-interval-ms=30000
legacysupply.status-poll-interval-ms=45000

server.port=8080
